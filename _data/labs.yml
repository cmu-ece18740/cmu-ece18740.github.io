# ---------------------------------------------------------------------------
# Lab assignments, rendered by labs.html.
#
# Nothing links this file to _data/schedule.yml automatically. The schedule
# repeats each lab's id, title, and duration in its own `lab_banner:` strings and
# in the `name:` of its due-date assignments, so a lab renamed, retimed, added,
# or dropped here has to be changed there by hand as well.
#
# Fields:
#   id        required -- "Lab 0" .. "Lab 4"
#   title     required
#   duration  optional -- printed after the title, e.g. "(2 weeks)"
#   team      optional -- only set it to mark an EXCEPTION to the default
#               (teams of 3, stated in the prose on labs.html). Lab 0 is
#               individual, so it carries `team: individual`.
#   tools     optional -- list, printed as "Tools: a, b"
#   bullets   optional -- list of what the lab covers
#   handout   optional -- a PDF path or Canvas link; makes the title a link
# ---------------------------------------------------------------------------

labs:
  - id: Lab 0
    title: Orientation
    duration: 1 week
    team: individual
    tools: [Gem5, McPAT]
    bullets:
      - Learn how to run programs in Gem5
      - Do some initial analysis of metrics and pipeline stalls
      - Play around with different built-in processor configurations
    # handout: https://canvas.cmu.edu   # optional -- a PDF path or Canvas link

  - id: Lab 1
    title: "CPU Design: Dynamic Branch Predictors"
    duration: 2 weeks
    tools: [Gem5, McPAT]
    bullets:
      - Implement different branch predictors (global, local, gshare, perceptron, TAGE) in C
      - "Study various metrics: performance, energy, area, efficiency"
      - Students come up with their own branch prediction algorithm (competition for best performance)

  - id: Lab 2
    title: "CPU Design: Superscalar Out-of-Order Structures and Cache Coherence"
    duration: 4 weeks
    tools: [VCS]
    bullets:
      - Study issue queues, wakeup/select logic, ROB sizing, dependency checking
      - Explore superscalar widths, pipeline stages, RS and ROB implementations in SystemVerilog
      - Implement cache coherence protocols (MSI, MESI) in C

  - id: Lab 3
    title: Profiling Snapdragon SoC
    duration: 4 weeks
    bullets:
      - >-
        Experimentally investigate and profile the behavior of single threaded,
        multi-threaded, GPU, NPU, and DSP workloads on the Snapdragon SoC
      - Heterogeneous profiling, including of the shared memory system on the Snapdragon SoC

  - id: Lab 4
    title: Heterogeneous Systems and Algorithms
    duration: 3.5 weeks
    bullets:
      - >-
        Conduct a study to showcase the differences between various heterogeneous
        algorithms and how they behave differently across a multitude of dimensions
      - Experimentally investigate running AI inference workloads on CPU-GPU-NPU systems
