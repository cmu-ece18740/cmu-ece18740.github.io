policies:
  late: >-
    You will work on Labs 1-5 in small teams of 2 students. All lab assignments
    are due at 11:59pm ET on the specified due date. The penalty for late
    assignments is 10% per day. Each student receives a budget of five grace days
    for the entire course; each grace day covers one late day without penalty.
    Grace days are applied automatically until you run out, but no more than two
    grace days may be used on any single lab assignment. Once your grace days are
    spent, you incur a 10% penalty for each subsequent late day. Late assignments
    are accepted up to two days after the specified due date only.
  accommodations: >-
    If you have a disability and have an accommodations letter from the
    Disability Resources office, please discuss your accommodations and needs
    with the instructors as early in the semester as possible. We will work with
    you to ensure that accommodations are provided as appropriate. If you suspect
    that you may have a disability and would benefit from accommodations but are
    not yet registered with the Office of Disability Resources, please contact
    them at access@andrew.cmu.edu.
