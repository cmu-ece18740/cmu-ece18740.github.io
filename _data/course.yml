description: >-
  Computer architecture deals with the art and science of designing and
  integrating hardware subsystems, spanning the hardware/software interface, to
  create a computer system that achieves functional correctness and meets design
  objectives in performance, power, energy, and cost. This course provides
  in-depth coverage of modern computer systems, with a special focus on
  Systems-on-Chip (SoCs) for mass-market mobile and edge computing devices,
  including smartphones, tablets, and diverse smart home/office devices. Topics
  span the design and evaluation of three major subsystems: (1) the processing
  subsystem -- superscalar out-of-order cores, multicore processors, asymmetric
  and heterogeneous cores, and AI/DL accelerators; (2) the memory subsystem --
  main memory and DRAM, multicore cache hierarchies, and co-processor shared
  memory management; and (3) the interconnect subsystem -- Network on Chip (NoC),
  multi-die packages, and chiplets. Each subsystem is studied from the
  perspective of several first-class design goals: performance, power
  consumption, and energy efficiency. The course places strong emphasis on
  professional design tools (architecture/microarchitecture simulators, RTL
  design and synthesis, area/power/thermal modeling) and on hands-on
  experimentation with physical hardware, with the goal of preparing students to
  be highly competent processor designers and computer architects in industry.

prereqs: >-
  Recommended pre/co-requisites: 15-513/18-613; 18-447 (or a course based on
  Computer Organization and Design by Patterson & Hennessy). Verilog and gem5
  experience would be very helpful.

