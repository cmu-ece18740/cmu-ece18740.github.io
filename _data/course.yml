# Rendered on course_info.html. `late` and `homework` are paragraph lists so a
# multi-paragraph policy keeps its structure; `bullets` renders as a <ul> after
# the paragraphs. `accommodations` is a single paragraph.
policies:
  late:
    paragraphs:
      - >-
        You will work on Labs 1-4 in small teams of 3 students each. All lab
        assignments are due at 11:59pm ET on the specified due date (lab
        deliverables usually on a Monday). Please check Piazza, Gradescope, and
        the course website for exact lab due dates.
      - >-
        The penalty for late lab assignments is 10% per day. Each student will
        receive a total budget of three grace days for the entire course. Each
        grace day can be used to cover one day late without incurring the 10%
        penalty.
    bullets:
      - >-
        Grace days are applied automatically until you run out. But, no more than
        two grace days can be used on any one lab assignment. Once you have spent
        all of your grace days, then you will receive a penalty of 10% for each
        subsequent late day.
      - >-
        Late assignments will only be accepted up to two days after the specified
        due date, or the termination date, i.e., all late submissions must be
        submitted by the termination date and can only be late by at most two
        days.
  homework:
    paragraphs:
      - >-
        Short weekly homeworks are due on Friday before recitation, covering the
        lecture concepts from previous weeks.
      - >-
        Homework serves to prepare students for exams, where the score will be
        based on completion. The homeworks will include feedback from course
        staff, which will emulate exam grading, for students to prepare and learn
        from before exams. Since homeworks are graded on completion there will be
        no late penalty on homework assignments, but timely course staff feedback
        is only guaranteed to on time submissions.
  accommodations: >-
    If you have a disability and have an accommodations letter from the
    Disability Resources office, please discuss your accommodations and needs
    with the instructors as early in the semester as possible. We will work with
    you to ensure that accommodations are provided as appropriate. If you suspect
    that you may have a disability and would benefit from accommodations but are
    not yet registered with the Office of Disability Resources, please contact
    them at access@andrew.cmu.edu.
