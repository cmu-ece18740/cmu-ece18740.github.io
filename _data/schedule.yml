# ---------------------------------------------------------------------------
# Course schedule for Fall 2026, rendered by index.html.
#
# Generated from temp-schedule.yml. Readings are NOT in that source, so the
# Readings column is currently empty -- add `readings:` to events as you go.
#
# STRUCTURE
#   weeks:            ordered list; each week renders as a rowspan group
#     week:           week number shown in the first column
#     lab_banner:     optional full-width banner row shown ABOVE the week
#     break_banner:   optional full-width break row shown ABOVE the week
#       date_text:    literal date text, e.g. "10/12-10/16" (a range, not a date)
#       title:        e.g. "NO CLASSES - Fall Break!!!"
#     readings:       optional reading list for the WHOLE week; spans the week's
#                     rows as a single cell
#       title:        free text
#       url:          optional -- renders as a link when present
#       optional:     true to prefix the entry with "(Optional)"
#     assignments:    optional release/due milestones; fills the last column.
#                     Dates need NOT be class days -- this is how a Monday
#                     deadline gets shown.
#       name:         e.g. "Lab 1"
#       status:       released | due -- OMIT for a plain dated note
#       date:         ISO yyyy-mm-dd
#       url:          optional link to the handout or submission page
#     events:         one entry per class meeting (TR = lecture, F = recitation)
#       date:         ISO yyyy-mm-dd (rendered as "Aug 25 (Tue)")
#       kind:         lecture | recitation | exam | holiday | tba
#       number:       lecture or recitation number
#       title:        free text
#       lecturer:     free text -- initials or a full name
#       note:         optional muted annotation, e.g. "Async"
#       link:         optional URL; the title links only when this is present
#
# YAML GOTCHA: quote any value containing ' #' -- in unquoted YAML a hash
# preceded by a space starts a comment, silently truncating the value.
#   title: MIDTERM EXAM #1     -> becomes "MIDTERM EXAM"
#   title: "MIDTERM EXAM #1"   -> correct
#
# SOURCE CORRECTIONS (verified against the CMU 2026-27 official calendar):
#   "8/30 Mon  Lab 0 Due"  -> 8/31; Aug 30 2026 is a SUNDAY
#   "9/29 Mon  HW 2 Due"   -> 9/28; Sep 29 2026 is a TUESDAY (a lecture day)
#   Both were the only two of 53 dated entries whose weekday label was wrong,
#   and every other deadline falls on a Monday.
#
# FALL 2026 CALENDAR (CMU registrar, 2026-27 Official Academic Calendar):
#   Classes         Mon Aug 24 - Fri Dec 4, 2026
#   Labor Day       Mon Sep 7                 (no classes)
#   Fall Break      Mon Oct 12 - Fri Oct 16   (no classes)
#   Democracy Day   Tue Nov 3                 (no classes)
#   Thanksgiving    Wed Nov 25 no classes; Thu Nov 26 - Fri Nov 27 closed
#   Final exams     Dec 7-8, 10-11, 14        (reading days Dec 9, 12-13)
# ---------------------------------------------------------------------------

